name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun run test
      - name: Lint active Auction Ace v2 path
        run: >-
          bunx eslint
          src/pages/DraftRoom.tsx
          src/components/PositionBudgetBar.tsx
          src/components/PlayerDetailsOverlay.tsx
          src/components/AiQuickPanel.tsx
          src/lib/api.ts
          src/lib/expected-price-model.ts
          src/lib/expected-price-model.test.ts
          src/lib/price-blend.ts
          src/lib/planner-strategies.ts
          src/lib/planner-suggest.test.ts
          supabase/functions/coach/index.ts
          --rule 'prefer-const: warn'
      - name: Production build
        run: bun run build
