kind = "web"
previewPath = "/auction-ace/"
title = "Auction Ace Coach"
version = "1.0.0"
id = "artifacts/auction-ace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/auction-ace/" ]
localPort = 25281

[services.development]
run = "pnpm --filter @workspace/auction-ace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auction-ace", "run", "build" ]
publicDir = "artifacts/auction-ace/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25281"
BASE_PATH = "/auction-ace/"
