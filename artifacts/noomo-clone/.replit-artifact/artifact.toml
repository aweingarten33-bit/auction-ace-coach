kind = "web"
previewPath = "/noomo/"
title = "Noomo Labs Clone"
version = "1.0.0"
id = "artifacts/noomo-clone"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/noomo/" ]
localPort = 18168

[services.development]
run = "pnpm --filter @workspace/noomo-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/noomo-clone", "run", "build" ]
publicDir = "artifacts/noomo-clone/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18168"
BASE_PATH = "/noomo/"
